[tools]
python = "latest"
node = "latest"
bun = "latest"

[tasks.test]
description = "Run the test suite with coverage"
run = ".venv/bin/pytest -v --ignore=tests/test_e2e --cov=blog_chat --cov-report=term-missing --cov-report=html:coverage_html --cov-report=json:coverage_html/coverage.json"

[tasks.test_e2e]
description = "Run end-to-end tests with Playwright"
run = ".venv/bin/pytest tests/test_e2e -v"

[tasks.build]
description = "Build frontend assets into static/"
run = "bun run build"

[tasks.migrate]
description = "Apply pending database migrations (uses DATABASE_URL from .env)"
run = ".venv/bin/alembic upgrade head"

[tasks.deploy]
description = "Deploy the whole service (app + Cloudflare tunnel) via Docker Compose. Builds the frontend, migrates the database, then starts the stack. Assumes .cloudflare/ config and credentials are prepared."
run = [
  "bun run build",
  ".venv/bin/alembic upgrade head",
  "docker compose up --build -d",
]

[tasks.dev]
description = "Run the development server with hot reload."
run = "tmux has-session -t $(basename $PWD)-dev 2>/dev/null && tmux attach-session -t $(basename $PWD)-dev || { tmux new-session -d -s $(basename $PWD)-dev 'pdm watch'; tmux split-window -t $(basename $PWD)-dev 'pdm dev'; tmux attach-session -t $(basename $PWD)-dev; }"