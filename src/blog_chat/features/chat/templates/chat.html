<div class="chat-panel-header">
    <div class="chat-panel-title">
        {% if post %}{{ t('chat_title') }}{% else %}Off-topic{% endif %} <span class="badge">chat</span>
    </div>
    <span class="chat-presence" id="chat-presence" data-label="{{ t('online') }}" title="{{ t('people_online') }}" role="status" aria-live="polite">
        <span class="loading-dots">...</span>
    </span>
</div>

<div class="chat-user">
    <span>{{ t('logged_in_as') }}</span>
    <button class="chat-user-name" id="username-btn" type="button" style="color: {{ username|username_color }};" title="{{ t('change_username') }}">{{ username }}</button>
</div>

<div class="chat-messages" id="chat-messages" role="log" aria-live="polite" data-username="{{ username|default('') }}">
    <div class="chat-empty" id="chat-empty">
        <p class="chat-empty-text">{{ t('no_messages') }}</p>
        <div class="chat-starter-prompts" id="starter-prompts">
            {% if post %}
            <button class="chat-starter" type="button" data-message="{{ t('starter_ask_message') }}" data-starter="{{ t('starter_ask') }}" data-starter-message="{{ t('starter_ask_message') }}">{{ t('starter_ask') }}</button>
            <button class="chat-starter" type="button" data-message="{{ t('starter_take_message') }}" data-starter="{{ t('starter_take') }}" data-starter-message="{{ t('starter_take_message') }}">{{ t('starter_take') }}</button>
            <button class="chat-starter" type="button" data-message="{{ t('starter_say_hi_message') }}" data-starter="{{ t('starter_say_hi') }}" data-starter-message="{{ t('starter_say_hi_message') }}">{{ t('starter_say_hi') }}</button>
            {% else %}
            <button class="chat-starter" type="button" data-message="{{ t('starter_say_hi_message') }}" data-starter="{{ t('starter_say_hi') }}" data-starter-message="{{ t('starter_say_hi_message') }}">{{ t('starter_say_hi') }}</button>
            <button class="chat-starter" type="button" data-message="{{ t('starter_reading_message') }}" data-starter="{{ t('starter_reading') }}" data-starter-message="{{ t('starter_reading_message') }}">{{ t('starter_reading') }}</button>
            <button class="chat-starter" type="button" data-message="{{ t('starter_share_message') }}" data-starter="{{ t('starter_share') }}" data-starter-message="{{ t('starter_share_message') }}">{{ t('starter_share') }}</button>
            {% endif %}
        </div>
    </div>
</div>

<div class="chat-input-area">
    <div class="chat-input-row" id="chat-input-group">
        <input type="text" class="chat-input" id="chat-input" placeholder="{{ t('type_message') }}" maxlength="280" autocomplete="off">
        <button class="chat-send-btn" id="chat-send" type="button">{{ t('send') }}</button>
    </div>
    <div class="chat-input-meta">
        <span id="chat-status" role="status" aria-live="polite"></span>
        <span id="chat-input-hint" style="display:none;">{{ t('enter_to_send') }}</span>
        <span class="chat-char-count" id="char-count" role="status" aria-live="polite">0/280</span>
    </div>
</div>
