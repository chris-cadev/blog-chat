<div class="chat-msg chat {% if isOwnMessage %}chat-start self{% else %}chat-end other{% endif %}">
    {% if show_header %}
    <div class="chat-msg-author" style="color: {{ userColor }};">{{ username }}</div>
    {% endif %}
    <div class="chat-msg-content">{{ content | markdown | safe }}</div>
    <time class="chat-msg-time">{{ timestamp }}</time>
</div>
